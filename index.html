<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Page Editor</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>

<style>
body{
    margin:0;
    padding:20px;
    font-family:Arial, sans-serif;
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.toolbar{
    display:flex;
    gap:15px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    margin-bottom:20px;
}

.upload-box{
    background:white;
    padding:12px 16px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    display:flex;
    flex-direction:column;
    gap:6px;
}

.upload-box label{
    font-size:12px;
    font-weight:bold;
    color:#2563eb;
}

.upload-box input[type=file]{
    font-size:13px;
}

button{
    padding:10px 18px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.primary{
    background:#2563eb;
    color:white;
}

.primary:hover{
    background:#1d4ed8;
}

#pages{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    min-height:50px;
}

.page-card{
    width:180px;
    background:white;
    border-radius:10px;
    padding:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
    cursor:move;
    position:relative;
}

.page-card canvas{
    width:100%;
    display:block;
    border:1px solid #ddd;
}

.page-info{
    margin-top:8px;
    text-align:center;
    font-size:12px;
    word-break:break-word;
}

.page-info .badge{
    display:inline-block;
    padding:1px 6px;
    border-radius:4px;
    font-size:10px;
    font-weight:bold;
    color:white;
    margin-bottom:3px;
}

.badge-a{ background:#2563eb; }
.badge-b{ background:#16a34a; }

.delete-btn{
    position:absolute;
    top:5px;
    right:5px;
    width:26px;
    height:26px;
    border:none;
    border-radius:50%;
    background:red;
    color:white;
    font-weight:bold;
    cursor:pointer;
    font-size:14px;
    line-height:1;
    z-index:2;
}

.delete-btn:hover{
    background:#b91c1c;
}

.status{
    text-align:center;
    margin-top:10px;
    margin-bottom:10px;
    color:#444;
    font-size:14px;
}
</style>
</head>
<body>

<h1>PDF Page Editor</h1>

<div class="toolbar">
    <div class="upload-box">
        <label>📄 FILE A (halaman 1 saja)</label>
        <input type="file" id="fileA" accept=".pdf">
    </div>

    <div class="upload-box">
        <label>📚 FILE B (semua halaman)</label>
        <input type="file" id="fileB" accept=".pdf">
    </div>

    <button class="primary" id="downloadBtn">
        ⬇ Download PDF Baru
    </button>
</div>

<div class="status" id="status"></div>

<div id="pages"></div>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const pagesContainer = document.getElementById('pages');
const statusText = document.getElementById('status');
const fileAInput = document.getElementById('fileA');
const fileBInput = document.getElementById('fileB');

// State terpisah untuk A dan B
let pdfA = null;   // { id, bytes, fileName }
let pdfB = null;   // { id, bytes, fileName }

// Halaman A & B disimpan terpisah biar bisa replace tanpa ganggu yang lain
let pagesA = [];   // halaman dari file A
let pagesB = [];   // halaman dari file B

let outputName = 'edited.pdf';

new Sortable(pagesContainer, {
    animation: 150
});

function generateId() {
    return Date.now().toString(36) +
           Math.random().toString(36).substring(2);
}

function cleanFileName(name) {
    return name
        .replace(/\s*\(\d+\)(?=\.pdf$)/i, '')
        .trim();
}

// Render ulang SEMUA card dari pagesA + pagesB (urutan: A dulu, B kemudian)
function renderAll() {
    pagesContainer.innerHTML = '';

    const allPages = [...pagesA, ...pagesB];
    allPages.forEach(p => pagesContainer.appendChild(p.card));

    updateStatus();
}

// Buat card dari sebuah halaman
async function createCard(pdf, pageNum, pdfId, fileName, tag) {
    const page = await pdf.getPage(pageNum);
    const viewport = page.getViewport({ scale: 0.4 });

    const canvas = document.createElement('canvas');
    const context = canvas.getContext('2d');
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({
        canvasContext: context,
        viewport: viewport
    }).promise;

    const pageId = generateId();

    const card = document.createElement('div');
    card.className = 'page-card';
    card.dataset.id = pageId;

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.innerHTML = '&times;';

    const info = document.createElement('div');
    info.className = 'page-info';

    const badgeClass = tag === 'A' ? 'badge-a' : 'badge-b';
    info.innerHTML = `
        <span class="badge ${badgeClass}">FILE ${tag}</span><br>
        <strong>${fileName}</strong><br>
        Halaman ${pageNum}
    `;

    card.appendChild(deleteBtn);
    card.appendChild(canvas);
    card.appendChild(info);

    const data = {
        id: pageId,
        pdfId: pdfId,
        pageNumber: pageNum,
        fileName: fileName,
        tag: tag,
        card: card
    };

    // Tombol hapus — cari di pagesA & pagesB, buang dari sana
    deleteBtn.onclick = () => {
        pagesA = pagesA.filter(p => p.id !== pageId);
        pagesB = pagesB.filter(p => p.id !== pageId);
        card.remove();
        updateStatus();
    };

    return data;
}

function updateStatus() {
    const total = pagesA.length + pagesB.length;
    statusText.innerText = `${total} halaman siap diedit ` +
        `(A: ${pagesA.length}, B: ${pagesB.length})`;
}

// ===== Upload FILE A =====
fileAInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    try {
        statusText.innerText = `Memproses File A: ${file.name}...`;

        const buffer = await file.arrayBuffer();
        const pdfBytes = new Uint8Array(buffer);

        const pdfId = generateId();
        pdfA = { id: pdfId, bytes: pdfBytes.slice(), fileName: file.name };

        const pdf = await pdfjsLib.getDocument({ data: pdfBytes }).promise;

        // Ambil halaman 1 saja → replace pagesA
        const cardData = await createCard(pdf, 1, pdfId, file.name, 'A');
        pagesA = [cardData];

        renderAll();

    } catch (error) {
        console.error(error);
        alert('Gagal membuka File A: ' + file.name);
        statusText.innerText = 'Error';
    }
});

// ===== Upload FILE B =====
fileBInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    try {
        statusText.innerText = `Memproses File B: ${file.name}...`;

        const buffer = await file.arrayBuffer();
        const pdfBytes = new Uint8Array(buffer);

        const pdfId = generateId();
        pdfB = { id: pdfId, bytes: pdfBytes.slice(), fileName: file.name };

        // Nama output dari file B (cleaned)
        outputName = cleanFileName(file.name);

        const pdf = await pdfjsLib.getDocument({ data: pdfBytes }).promise;

        // Ambil semua halaman → replace pagesB
        const newPages = [];
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            const cardData = await createCard(pdf, pageNum, pdfId, file.name, 'B');
            newPages.push(cardData);
        }
        pagesB = newPages;

        renderAll();

    } catch (error) {
        console.error(error);
        alert('Gagal membuka File B: ' + file.name);
        statusText.innerText = 'Error';
    }
});

// ===== Export =====
document.getElementById('downloadBtn').addEventListener('click', exportPDF);

async function exportPDF() {
    try {
        // Baca urutan sesuai DOM (biar hasil swap keikut)
        const cards = [...document.querySelectorAll('.page-card')];

        if (cards.length === 0) {
            alert('Tidak ada halaman');
            return;
        }

        statusText.innerText = 'Membuat PDF baru...';

        // Gabung semua page data (A + B) buat lookup by id
        const allPages = [...pagesA, ...pagesB];
        const pageMap = {};
        allPages.forEach(p => pageMap[p.id] = p);

        const mergedPdf = await PDFLib.PDFDocument.create();
        const cache = {};

        for (const card of cards) {
            const pageData = pageMap[card.dataset.id];
            if (!pageData) continue;

            if (!cache[pageData.pdfId]) {
                // Cari bytes dari pdfA atau pdfB
                let sourceBytes = null;
                if (pdfA && pdfA.id === pageData.pdfId) sourceBytes = pdfA.bytes;
                if (pdfB && pdfB.id === pageData.pdfId) sourceBytes = pdfB.bytes;

                if (!sourceBytes) continue;

                cache[pageData.pdfId] =
                    await PDFLib.PDFDocument.load(sourceBytes);
            }

            const sourcePdf = cache[pageData.pdfId];
            const copiedPages = await mergedPdf.copyPages(
                sourcePdf,
                [pageData.pageNumber - 1]
            );

            mergedPdf.addPage(copiedPages[0]);
        }

        const pdfBytes = await mergedPdf.save();

        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = outputName;

        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(url);

        statusText.innerText = 'PDF berhasil dibuat';
    } catch (error) {
        console.error(error);
        statusText.innerText = 'Gagal membuat PDF';
        alert('Error: ' + error.message);
    }
}

</script>

</body>
</html>
