<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF Page Editor (Local)</title>

<script src="libs/pdf.min.js"></script>
<script src="libs/pdf-lib.min.js"></script>
<script src="libs/Sortable.min.js"></script>

<style>
body{margin:0;padding:20px;font-family:Arial,sans-serif;background:#f5f5f5}
h1{text-align:center}
.toolbar{display:flex;gap:15px;justify-content:center;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.upload-box{background:#fff;padding:12px 16px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:6px}
.upload-box label{font-size:12px;font-weight:bold;color:#2563eb}
.upload-box input[type=file]{font-size:13px}
button{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
.primary{background:#2563eb;color:#fff}
.primary:hover{background:#1d4ed8}
#pages{display:flex;flex-wrap:wrap;gap:15px;min-height:50px}
.page-card{width:180px;background:#fff;border-radius:10px;padding:10px;box-shadow:0 2px 8px rgba(0,0,0,.15);cursor:move;position:relative}
.page-card canvas{width:100%;display:block;border:1px solid #ddd;background:#eee;min-height:120px}
.page-info{margin-top:8px;text-align:center;font-size:12px;word-break:break-word}
.page-info .badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:10px;font-weight:bold;color:#fff;margin-bottom:3px}
.badge-a{background:#2563eb}.badge-b{background:#16a34a}
.delete-btn{position:absolute;top:5px;right:5px;width:26px;height:26px;border:none;border-radius:50%;background:red;color:#fff;font-weight:bold;cursor:pointer;font-size:14px;line-height:1;z-index:2}
.delete-btn:hover{background:#b91c1c}
.status{text-align:center;margin:10px 0;color:#444;font-size:14px}
</style>
</head>
<body>

<h1>PDF Page Editor (Local)</h1>

<div class="toolbar">
    <div class="upload-box">
        <label>📄 FILE A (halaman 1 saja)</label>
        <input type="file" id="fileA" accept=".pdf">
    </div>
    <div class="upload-box">
        <label>📚 FILE B (semua halaman)</label>
        <input type="file" id="fileB" accept=".pdf">
    </div>
    <button class="primary" id="downloadBtn">⬇ Download PDF Baru</button>
</div>

<div class="status" id="status"></div>
<div id="pages"></div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'libs/pdf.worker.min.js';

const pagesContainer = document.getElementById('pages');
const statusText     = document.getElementById('status');
const fileAInput     = document.getElementById('fileA');
const fileBInput     = document.getElementById('fileB');

let pdfA = null;
let pdfB = null;
let pagesA = [];
let pagesB = [];
let outputName = 'edited.pdf';

const pdfjsCache = {};

new Sortable(pagesContainer, { animation: 150 });

const THUMB_MAX_WIDTH = 150;
const CONCURRENCY     = 4;

function generateId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2);
}
function cleanFileName(name) {
    return name.replace(/\s*\(\d+\)(?=\.pdf$)/i, '').trim();
}

function renderAll() {
    pagesContainer.innerHTML = '';
    const allPages = [...pagesB, ...pagesA];
    allPages.forEach(p => pagesContainer.appendChild(p.card));
    updateStatus();
}

function updateStatus() {
    const total = pagesA.length + pagesB.length;
    statusText.innerText = `${total} halaman siap diedit (A: ${pagesA.length}, B: ${pagesB.length})`;
}

function createCardPlaceholder(pdfId, pageNum, fileName, tag) {
    const pageId = generateId();
    const card = document.createElement('div');
    card.className = 'page-card';
    card.dataset.id = pageId;

    const deleteBtn = document.createElement('button');
    deleteBtn.className = 'delete-btn';
    deleteBtn.innerHTML = '&times;';

    const canvas = document.createElement('canvas');
    canvas.width = THUMB_MAX_WIDTH;
    canvas.height = Math.round(THUMB_MAX_WIDTH * 1.4);

    const info = document.createElement('div');
    info.className = 'page-info';
    const badgeClass = tag === 'A' ? 'badge-a' : 'badge-b';
    info.innerHTML = `
        <span class="badge ${badgeClass}">FILE ${tag}</span><br>
        <strong>${fileName}</strong><br>
        Halaman ${pageNum}
    `;

    card.appendChild(deleteBtn);
    card.appendChild(canvas);
    card.appendChild(info);

    deleteBtn.onclick = () => {
        pagesA = pagesA.filter(p => p.id !== pageId);
        pagesB = pagesB.filter(p => p.id !== pageId);
        card.remove();
        updateStatus();
    };

    return {
        id: pageId,
        pdfId,
        pageNumber: pageNum,
        fileName,
        tag,
        card,
        canvas,
        _rendered: false
    };
}

async function renderThumb(pageData) {
    if (pageData._rendered) return;
    pageData._rendered = true;

    try {
        const pdf = pdfjsCache[pageData.pdfId];
        if (!pdf) return;

        const page = await pdf.getPage(pageData.pageNumber);
        const vp1 = page.getViewport({ scale: 1 });
        const scale = THUMB_MAX_WIDTH / vp1.width;
        const viewport = page.getViewport({ scale });

        const canvas = pageData.canvas;
        canvas.width  = Math.max(1, Math.floor(viewport.width));
        canvas.height = Math.max(1, Math.floor(viewport.height));

        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = false;

        await page.render({
            canvasContext: ctx,
            viewport,
            intent: 'display'
        }).promise;
    } catch (e) {
        console.warn('thumb error', e);
    }
}

async function renderAllThumbs(list) {
    const queue = list.slice();
    const workers = Array.from({ length: CONCURRENCY }, async () => {
        while (queue.length) {
            const item = queue.shift();
            await renderThumb(item);
        }
    });
    await Promise.all(workers);
}

fileAInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    try {
        statusText.innerText = `Memproses File A: ${file.name}...`;

        const pdfBytes = new Uint8Array(await file.arrayBuffer());
        const pdfId = generateId();
        pdfA = { id: pdfId, bytes: pdfBytes.slice(), fileName: file.name };

        const pdf = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
        pdfjsCache[pdfId] = pdf;

        const cardData = createCardPlaceholder(pdfId, 1, file.name, 'A');
        pagesA = [cardData];
        renderAll();
        renderThumb(cardData);

    } catch (error) {
        console.error(error);
        alert('Gagal membuka File A: ' + file.name);
        statusText.innerText = 'Error';
    }
});

fileBInput.addEventListener('change', async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    try {
        statusText.innerText = `Memproses File B: ${file.name}...`;

        const pdfBytes = new Uint8Array(await file.arrayBuffer());
        const pdfId = generateId();
        pdfB = { id: pdfId, bytes: pdfBytes.slice(), fileName: file.name };
        outputName = cleanFileName(file.name);

        const pdf = await pdfjsLib.getDocument({ data: pdfBytes.slice() }).promise;
        pdfjsCache[pdfId] = pdf;

        const newPages = [];
        for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
            newPages.push(createCardPlaceholder(pdfId, pageNum, file.name, 'B'));
        }
        pagesB = newPages;
        renderAll();

        renderAllThumbs(newPages).then(() => {
            statusText.innerText = `${pagesA.length + pagesB.length} halaman siap diedit`;
        });

    } catch (error) {
        console.error(error);
        alert('Gagal membuka File B: ' + file.name);
        statusText.innerText = 'Error';
    }
});

document.getElementById('downloadBtn').addEventListener('click', exportPDF);

async function exportPDF() {
    try {
        const cards = [...document.querySelectorAll('.page-card')];
        if (cards.length === 0) {
            alert('Tidak ada halaman');
            return;
        }

        statusText.innerText = 'Membuat PDF baru...';

        const allPages = [...pagesA, ...pagesB];
        const pageMap = {};
        allPages.forEach(p => pageMap[p.id] = p);

        const mergedPdf = await PDFLib.PDFDocument.create();
        const cache = {};

        for (const card of cards) {
            const pageData = pageMap[card.dataset.id];
            if (!pageData) continue;

            if (!cache[pageData.pdfId]) {
                let sourceBytes = null;
                if (pdfA && pdfA.id === pageData.pdfId) sourceBytes = pdfA.bytes;
                if (pdfB && pdfB.id === pageData.pdfId) sourceBytes = pdfB.bytes;
                if (!sourceBytes) continue;
                cache[pageData.pdfId] = await PDFLib.PDFDocument.load(sourceBytes);
            }

            const sourcePdf = cache[pageData.pdfId];
            const [copied] = await mergedPdf.copyPages(sourcePdf, [pageData.pageNumber - 1]);
            mergedPdf.addPage(copied);
        }

        const pdfBytes = await mergedPdf.save();
        const blob = new Blob([pdfBytes], { type: 'application/pdf' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = outputName;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        statusText.innerText = 'PDF berhasil dibuat';
    } catch (error) {
        console.error(error);
        statusText.innerText = 'Gagal membuat PDF';
        alert('Error: ' + error.message);
    }
}
</script>
</body>
</html>
